<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fixed5-Anchor · 5000</title>
<style>body{background:#101319;color:#dce3ed;font:15px system-ui;max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:25px}small{color:#91a1b8}.cards{display:flex;flex-wrap:wrap;gap:12px}.card{background:#1b222e;padding:20px;min-width:140px;border-radius:10px}.card b{display:block;font-size:26px;margin-top:8px}progress{width:100%;height:20px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #2a3241}a{color:#86b9ff}#note{color:#e7bc77}</style>
<h1>Fixed5-Anchor · 教师数据</h1><p id="updated">等待进度文件…</p><div class="cards" id="cards"></div><progress id="bar" max="5000" value="0"></progress><p id="note"></p><p><small>每条：总计划＋5帧，6次压缩。生成 high / 压缩 high。Token 统计为本次进程收到的 API usage，含重试，不含导入缓存；剩余时间按最近30分钟完成速度估算。</small></p><h2>当前任务</h2><input id="filter" placeholder="搜索 ID / 状态" oninput="draw()"><table><thead><tr><th>任务</th><th>状态</th><th>阶段</th><th>帧</th><th>结果</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){const p=window.PROGRESS;if(!p)return;const c=p.counts,u=p.session_usage;document.getElementById('updated').textContent='更新：'+new Date(p.updated_epoch*1000).toLocaleString()+' · '+p.status;const vals=[['完成',`${c.complete||0} / ${p.total}`],['生成中',c.generating||0],['压缩中',c.compressing||0],['失败待处理',c.failed||0],['请求并发',`${p.active_requests} / ${p.concurrency}`],['每小时完成',p.tasks_per_hour.toFixed(1)],['剩余小时',p.eta_hours==null?'积累样本中':p.eta_hours.toFixed(1)],['输入 tokens',(u.prompt_tokens||0).toLocaleString()],['输出 tokens',(u.completion_tokens||0).toLocaleString()],['请求错误',u.request_errors||0]];document.getElementById('cards').innerHTML=vals.map(([a,b])=>`<div class="card">${a}<b>${b}</b></div>`).join('');document.getElementById('bar').max=p.total;document.getElementById('bar').value=c.complete||0;document.getElementById('note').textContent=Date.now()/1000-p.updated_epoch>60?'同步超过一分钟，请检查本地生成进程。':'';const q=document.getElementById('filter').value.toLowerCase();document.getElementById('rows').innerHTML=Object.entries(p.tasks).filter(([id,s])=>(id+' '+s.status).toLowerCase().includes(q)).slice(0,300).map(([id,s])=>`<tr><td>${esc(id)}</td><td>${esc(s.status)}</td><td>${esc(s.stage)} ${esc(s.error||'')}</td><td>${s.frames}/5</td><td>${s.status==='complete'?`<a href="results/${encodeURIComponent(id)}/animation.gif">GIF</a>`:''}</td></tr>`).join('')}
function poll(){const s=document.createElement('script');s.src='progress.js?t='+Date.now();s.onload=()=>{draw();s.remove()};s.onerror=()=>s.remove();document.head.append(s)}poll();setInterval(poll,10000);
</script>
